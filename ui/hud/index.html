<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>数学阶梯 · HUD</title>
<link rel="stylesheet" href="/vendor/katex.min.css">
<link rel="stylesheet" href="./style.css">
</head>
<body data-page="home">
  <!-- 星野 + 网格地平线画布背景(节流绘制) -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <!-- 扫描线 + 移动亮扫 + 暗角,纯装饰不拦截交互 -->
  <div class="fx-scan" aria-hidden="true"></div>

  <!-- 顶部 HUD 状态条 -->
  <header class="hud-top">
    <a class="brand" href="#/">
      <span class="brand-mark">◢</span>
      <span class="brand-name">数学阶梯</span>
      <span class="brand-sub">MATH·LADDER // HUD-01</span>
    </a>
    <nav class="top-nav">
      <a href="#/" data-nav="home">首页</a>
      <a href="#/graph" data-nav="graph">图谱</a>
    </nav>
    <div class="readouts" id="readouts" aria-label="实时读数">
      <span class="ro"><label>CLOCK</label><b id="ro-clock">--:--:--</b></span>
      <span class="ro"><label>章</label><b id="ro-chap">--</b></span>
      <span class="ro"><label>课</label><b id="ro-lesson">---</b></span>
      <span class="ro"><label>已完成</label><b id="ro-done">---</b></span>
      <span class="ro"><label>进度</label><b id="ro-pct">--%</b></span>
    </div>
    <div class="hud-search" id="hud-search">
      <input id="search-input" type="search" placeholder="检索课程…" autocomplete="off" spellcheck="false">
      <div id="search-drop" class="search-drop" hidden></div>
    </div>
  </header>

  <!-- 路由视图 -->
  <main id="view" tabindex="-1"></main>

  <footer class="hud-foot">
    <span>数学阶梯 · 独立阅读终端</span>
    <span class="dim">// 进度仅存于本机浏览器</span>
  </footer>

  <!-- 浮窗 Python 控制台(自包含模块,自行注入 DOM) -->
  <script type="module" src="./console.js"></script>
  <!-- 知识树画布(自包含模块) -->
  <script type="module" src="./graph.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
