# =============================================================================
#  数学阶梯 · nginx 站点配置
#
#  放到哪：  Debian/Ubuntu  →  /etc/nginx/conf.d/math-ladder.conf（conf.d/*.conf 会被自动 include）
#            CentOS/RHEL   →  /etc/nginx/conf.d/math-ladder.conf 同上
#  生效：    sudo nginx -t && sudo systemctl reload nginx
#
#  这个 server 块管两件事：
#    1. 静态站点本体 —— root 指向解压出来的 build/（Docusaurus 产物，纯静态）
#    2. /api/ 反代到本机的云同步服务（Node，只监听 127.0.0.1:8787，外面直连不到）
#
#  ⚠️ 只想部署静态站（不要云同步）时，把下面「云同步 API」那一整段删掉即可，
#     站点功能不受影响：前端探测不到后端会静默降级，数据只存这台浏览器。
#
#  路径与端口约定（本文件、systemd unit、README-部署.md 三处必须一致，改就一起改）：
#    站点根目录   /var/www/math-ladder          zip 解压到这里
#    静态产物     /var/www/math-ladder/build    nginx 的 root
#    同步服务     127.0.0.1:8787
# =============================================================================

server {
    listen 80;
    listen [::]:80;          # 服务器没开 IPv6 就把这行注释掉，否则 nginx 起不来

    server_name _;           # ← 换成你的域名，例如 math.example.com

    # 指到 build/ 这一层，不是解压出来的 math-ladder/ 那一层。
    # 指错一层的症状是「首页 404 / 纸张样式全丢」，但 /api 反代照样正常，很容易误判成后端问题。
    root /var/www/math-ladder/build;
    index index.html;

    server_tokens off;
    charset utf-8;

    # 上传体量：PUT /api/sync 一次最多带 4 MB（服务端上限），而 nginx 默认只有 1m，
    # 不改的话数据在网关这一层就先被 413 拦掉，后端日志里什么都看不到。
    client_max_body_size 8m;

    access_log /var/log/nginx/math-ladder.access.log;
    error_log  /var/log/nginx/math-ladder.error.log;

    # ---------------- 压缩 ----------------
    # 只压文本类。图片 / PDF / woff2 本身已是压缩格式，再压一遍只是白烧 CPU。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/xml+rss image/svg+xml;

    # ---------------- 云同步 API ----------------
    location /api/ {
        # 结尾不带 /：把 /api/login 原样透传给后端，不剥掉 /api 前缀。
        # 后端路由是按 /api/xxx 写的，加了尾斜杠会变成「转发 /login」，后端直接 404。
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # 后端按 IP 做登录限流，拿不到真实来源 IP 的话限流会误伤（所有人共用一个 127.0.0.1）。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 同步数据是私有的，任何一层缓存都不许留。
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;

        # 同步是「改完两秒后发一次」的小请求，超时给宽松点只为兜住偶发抖动。
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---------------- 静态资源：文件名带内容哈希，可以放心长缓存 ----------------
    # Docusaurus 把 js / css / 字体都放在 assets/ 下，文件名里带哈希，内容一变名字就变，
    # 所以缓存一年也不会拿到旧内容；这里换成短缓存只会让老用户每次回访都白下载一遍。
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;      # 这里不许回落到 index.html：js 真 404 时必须立刻暴露
    }

    # 图片与论文 PDF 的名字不带哈希，折中给一天
    location ^~ /img/    { expires 1d; add_header Cache-Control "public"; try_files $uri =404; }
    location ^~ /papers/ { expires 1d; add_header Cache-Control "public"; try_files $uri =404; }

    # ---------------- HTML：不给缓存 ----------------
    # 每次出包都是新的一套 chunk 文件名，index.html 被缓存住 = 老页面去要早被删掉的 chunk，
    # 表现是「点哪都白屏」，而且只在老访客身上复现，最难查。
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ---------------- SPA 回落 ----------------
    # Docusaurus 已经为每条路由生成了目录 index.html，这里兜的是少了结尾斜杠、
    # 或路径还没生成的情况。=404 是保险：连 index.html 都不存在时别陷入内部重定向循环。
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}

